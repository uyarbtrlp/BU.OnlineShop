name: Build & Release Webgateway

on:
  push:
    paths:
      - 'gateways/**'
      - '.github/workflows/webgateway-release.yml'
    branches:
      - development

jobs:
  common:
    uses: ./.github/workflows/common.yml
        
  release:
    needs: common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateways

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release and plugins
        run: npm install --no-save semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
        # This will:
        # - Analyze commits for version bump
        # - Create a GitHub release and changelog
        # - Tag the repo (e.g., catalog-v1.2.3)

      - name: Extract version
        id: get_version  
        run: |
          VERSION=$(git describe --tags --match "webgateway-v*" --abbrev=0 | sed 's/webgateway-v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateways/BU.OnlineShop.WebGateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webgateway:${{ steps.get_version.outputs.version }}
