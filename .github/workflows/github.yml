name: Github actions

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6

  dotnet:
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  release:
    needs: dotnet
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release | tee semantic-release.log
      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' semantic-release.log | tail -1)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  docker-build:
    needs: [dotnet, release]
    runs-on: ubuntu-latest
    if: needs.release.outputs.version != ''
    strategy:
     matrix:
      include:
      - service: catalog
        folder: Catalog
      - service: order
        folder: Ordering
      - service: file
        folder: File
      - service: basket
        folder: Basket
      - service: payment
        folder: Payment
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}service image
        uses: docker/build-push-action@v5
        with:
          file: ./services/${{ matrix.service }}/BU.OnlineShop.${{ matrix.folder }}Service.API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}service:${{ needs.release.outputs.version }}
      - name: Build and push web gateway image
        uses: docker/build-push-action@v5
        with:
          file: ./gateways/BU.OnlineShop.WebGateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webgateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webgateway:${{ needs.release.outputs.version }}