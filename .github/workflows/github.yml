# filepath: .github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - development

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - catalog
          - order
          - file
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Get version
        id: get_version
        run: |
          cd services/${{ matrix.service }}
          echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - name: Build and Push Docker Image
        run: |
          docker build -t yourdockerhub/${{ matrix.service }}service:${{ steps.get_version.outputs.version }} ./services/${{ matrix.service }}
          docker push yourdockerhub/${{ matrix.service }}service:${{ steps.get_version.outputs.version }}