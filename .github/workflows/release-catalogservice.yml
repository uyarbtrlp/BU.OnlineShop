name: Version Microservices

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/**'
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: npm install

      - name: Install Changesets CLI
        run: npm install --global @changesets/cli

      - name: Create Changesets (if needed)
        run: |
          npx changeset status
          # Optionally, automate changeset creation if you have a convention or tool for this

      - name: Version Packages
        run: npx changeset version

      - name: Commit version and changelog updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: version packages and update changelogs [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}