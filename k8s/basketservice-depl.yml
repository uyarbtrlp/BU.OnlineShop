apiVersion: apps/v1
kind: Deployment
metadata:
  name: basketservice-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basketservice
  template:
    metadata: 
      labels:
        app: basketservice
    spec:
      containers:
        - name: basketservice
          image: btrlpuyr/basketservice:latest
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              value: Server=mssql-clusterip-srv,1434;User Id=sa;Password=myPassw0rd;Initial Catalog=BasketServiceDb;MultipleActiveResultSets=true;TrustServerCertificate=True; # Change sql server DNS name according to module name
            - name: Keycloak__Realm
              value: "onlineshop"
            - name: Keycloak__AuthServerUrl
              value: "http://keycloak"
            - name: Keycloak__Audience
              value: "BasketService"
            - name: Keycloak__SslRequired
              value: "none"
            - name: Keycloak__Resource
              value: "OnlineShop_Swagger"
            - name: Keycloak__VerifyTokenAudience
              value: "true"
            - name: Keycloak__Credentials__Secret
              value: "KYMyRvmJeu9Sarv5jhEtFIA6frgAV5to"
            - name: BasketServiceTokenExchange__Authority
              value: "http://keycloak/realms/onlineshop"
            - name: BasketServiceTokenExchange__RequireHttpsMetadata
              value: "false"
            - name: Swagger__Authority
              value: "https://keycloak.onlineshop.com/realms/onlineshop/protocol"
            - name: Swagger__ClientId
              value: "OnlineShop_Swagger"
            - name: Swagger__ClientSecret
              value: "KYMyRvmJeu9Sarv5jhEtFIA6frgAV5to"
            - name: RemoteServices__CatalogService__Uri
              value: http://catalogservice-clusterip-srv:8080
            - name: RemoteServices__PaymentService__Uri
              value: http://paymentservice-clusterip-srv:8080
            - name: RabbitMQ__Host
              value: rabbitmq-clusterip-srv
            - name: RabbitMQ__Username
              value: "user"
            - name: RabbitMQ__Password
              value: "bitnami"
---
apiVersion: v1
kind: Service
metadata:
  name: basketservice-clusterip-srv
spec:
  type: ClusterIP
  selector: 
    app: basketservice
  ports:
    - name: basketservice
      protocol: TCP
      port: 8080
      targetPort: 8080