version: '3.4'

services:
  basketservice:
    environment:
      - ASPNETCORE_HTTP_PORTS=8080 # Be sure about http port exposure      
      - ASPNETCORE_HTTPS_PORTS=8081 # Be sure about https port exposure
      - Keycloak__Realm=onlineshop
      - Keycloak__AuthServerUrl=http://onlineshop-keycloak.localhost:8080 # It should be configured as https with dns name in production.
      - Keycloak__Audience=BasketService
      - Keycloak__SslRequired=none
      - Keycloak__Resource=OnlineShop_Swagger
      - Keycloak__VerifyTokenAudience=true
      - Keycloak__Credentials__Secret=MfWUyG5jemmQI51Il7GLBNzloLU4Wv4C
      - BasketServiceTokenExchange__Authority=http://onlineshop-keycloak.localhost:8080/realms/onlineshop  # Use container name with http without "/" at the end
      - BasketServiceTokenExchange__RequireHttpsMetadata=false
      - Swagger__Authority=http://onlineshop-keycloak.localhost:8080/realms/onlineshop/protocol
      - Swagger__ClientId=OnlineShop_Swagger
      - Swagger__ClientSecret=MfWUyG5jemmQI51Il7GLBNzloLU4Wv4C
      - CorsOrigins=https://localhost:7235
      - ConnectionStrings__DefaultConnection=Server=onlineshop-sql-server;User Id=sa;Password=myPassw0rd;Initial Catalog=BasketServiceDb;MultipleActiveResultSets=true;TrustServerCertificate=True; # Change sql server DNS name according to module name
      - RemoteServices__CatalogService__Uri=http://onlineshop-catalogservice:8080 # Api calls must be against to internal docker network
      - RemoteServices__PaymentService__Uri=http://onlineshop-paymentservice:8080 # Api calls must be against to internal docker network
      - RabbitMQ__Host=onlineshop-rabbitmq
      - RabbitMQ__Username=user  
      - RabbitMQ__Password=bitnami
      - Kestrel__Certificates__Default__Path=/app/certificate/localhost.crt
      - Kestrel__Certificates__Default__KeyPath=/app/certificate/localhost.key
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://onlineshop-aspire:18889
    ports:
      - "7202:8081"
